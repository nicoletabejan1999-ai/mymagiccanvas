name: Temporary Meta Purchase Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-purchase-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel
        run: sleep 45
      - name: Run diagnostic
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 10 \
            https://mymagiccanvas.vercel.app/api/meta-diagnose
